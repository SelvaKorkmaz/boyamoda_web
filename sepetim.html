<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sepetim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background: #f9f9f9;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 10px 20px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            color: purple;
        }

        .nav ul {
            display: flex;
            list-style: none;
        }

        .nav ul li {
            margin-left: 20px;
        }

        .nav ul li a {
            text-decoration: none;
            color: #333;
            transition: color 0.3s;
            font-weight: bold;
        }

        .nav ul li a:hover {
            color: purple;
        }

        .hero {
            text-align: center;
            padding: 50px;
            background: linear-gradient(to left, gray, white, gray);
            color: purple;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .cart {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
            width: 100%;
            max-width: 600px;
            margin: 0 auto 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .cart-item span {
            font-size: 1em;
            color: #333;
        }

        .purchase-button {
            display: block;
            background: purple;
            color: white;
            text-align: center;
            border: none;
            padding: 15px 20px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 auto;
            max-width: 200px;
            transition: background 0.3s;
        }

        .purchase-button:hover {
            background: darkviolet;
        }
    </style>
    <script>
        // Sayfa yüklendiğinde sepeti yerel depolamadan getir
        document.addEventListener('DOMContentLoaded', () => {
            const cartContainer = document.querySelector('.cart');
            const storedCart = JSON.parse(localStorage.getItem('cart')) || [];

            if (storedCart.length === 0) {
                cartContainer.innerHTML = '<p align="center">Sepetiniz boş! Hemen doldurmaya başla.</p>';
                return;
            }

            let totalPrice = 0;
            storedCart.forEach(item => {
                const cartItem = document.createElement('div');
                cartItem.classList.add('cart-item');

                const nameSpan = document.createElement('span');
                nameSpan.textContent = item.name;

                const priceSpan = document.createElement('span');
                priceSpan.textContent = `₺${item.price}`;

                cartItem.appendChild(nameSpan);
                cartItem.appendChild(priceSpan);
                cartContainer.appendChild(cartItem);

                totalPrice += item.price;
            });

            // Toplam fiyat
            const totalItem = document.createElement('div');
            totalItem.classList.add('cart-item');
            totalItem.innerHTML = `<span>Toplam</span><span>₺${totalPrice}</span>`;
            cartContainer.appendChild(totalItem);

            // Satın Al butonu oluştur ve sepete ekle
            const purchaseButton = document.createElement('button');
            purchaseButton.classList.add('purchase-button');
            purchaseButton.textContent = 'Satın Al';
            purchaseButton.addEventListener('click', () => {
                localStorage.removeItem('cart'); // Sepeti temizle
                alert('Satın alma işlemi başarıyla tamamlandı!');
                location.reload(); // Sayfayı yenile
            });
            document.body.appendChild(purchaseButton);
        });
    </script>
</head>
<body>
    <header class="header">
        <div class="logo">BOYAMODA</div>
        <nav class="nav">
            <ul>
                <li><a href="anasayfa.html">Anasayfa</a></li>
                <li><a href="renkler.html">Renkler</a></li>
                <li><a href="boyalar.html">Boyalar</a></li>
                <li><a href="hakkımızda.html">Hakkımızda</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
                <li><a href="sepetim.html">Sepetim</a></li>
            </ul>
        </nav>
    </header><br>
    <section id=sepetim class="hero">
        <h1>SEPETİM</h1>
        <p>Eklediğin ürünler burada! Tükenmeden al.</p>
    </section>
    <div class="cart"></div>
</body>
</html>
