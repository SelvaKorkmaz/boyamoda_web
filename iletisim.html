    <section id="iletisim" class="hero">
        <h1>İLETİŞİM</h1>
        <p>En iyisi için bizim ile iletişime geçin.</p>
    </section>


    <section class="container">
        <div class="iletisim">
            <h2><font color="purple">İletişim Formu</font></h2>
            <form class="iletisim-form">
                <div class="form-grup">
                    <label for="ad">Adınız-Soyadınız:</label>
                    <input type="text" id="ad" placeholder="Adınızı ve Soyadınızı giriniz...">
                </div>
                <div class="form-grup">
                    <label for="email">E-posta:</label>
                    <input type="email" id="email" placeholder="E-posta adresinizi giriniz...">
                </div>
                <div class="form-grup">
                    <label for="mesaj">Mesajınız:</label>
                    <textarea id="mesaj" rows="4" placeholder="Mesajınızı yazınız..."></textarea>
                </div>
                <button type="submit" class="gonder-btn">Gönder</button>
            </form>
        </div>
    </section>
    <br><br>
